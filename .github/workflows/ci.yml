name: Portfolio CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase Function dependencies
        working-directory: functions
        run: npm ci

      - name: Lint Firebase Functions
        working-directory: functions
        run: npm run lint

      - name: Check important frontend files exist
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/script.js